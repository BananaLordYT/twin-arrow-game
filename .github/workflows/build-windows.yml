name: Build Windows releases

on:
  workflow_dispatch:
  push:
    paths:
      - 'TwinArrowArena-WindowsEdition/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install game and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r TwinArrowArena-WindowsEdition/requirements.txt pyinstaller
      - name: Build portable executable
        working-directory: TwinArrowArena-WindowsEdition
        run: pyinstaller --noconfirm --clean --onefile --noconsole --name TwinArrowArena twin_arrow_arena.py
      - uses: actions/upload-artifact@v4
        with:
          name: Twin-Arrow-Arena-Windows
          path: |
            TwinArrowArena-WindowsEdition/dist/TwinArrowArena.exe
            TwinArrowArena-WindowsEdition/server_url.txt
          if-no-files-found: error
          retention-days: 30
